name: Main Branch Quality & Security Checks

# Run on every push and pull request to main
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  build-and-verify:
    name: Build and verify site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds dist/ and fails on missing i18n keys
      - name: Build static site
        run: npm run build

      # Broken links, missing SEO tags, invalid JSON-LD, sitemap coverage
      - name: Check built site
        run: npm run check

      # Ready-to-upload bundle for cPanel hosting (see DEPLOY.md)
      - name: Upload site bundle
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30

  lint-and-scan:
    name: Code Compliance and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Super-linter needs full history to track changes

      - name: Run Super-Linter (HTML, CSS, JS, JSON)
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          CREATE_STATUS_CHECK: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          FILTER_REGEX_EXCLUDE: '.*(google|node_modules|dist|package-lock).*'

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
