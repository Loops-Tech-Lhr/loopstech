<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/loopstech-favicon.png">
    <link rel="apple-touch-icon" href="img/loopstech-favicon.png">
    
    <!-- SEO Meta Tags -->
    <title>Loops Technologies | Premier Software House in Riyadh & Lahore</title>
    <meta name="description" content="Loops Technologies provides expert Web Apps, Mobile Apps, and AI Support Agents. Trusted IT partner in Riyadh and Lahore with 10+ years of experience.">
    <meta name="keywords" content="Software house Riyadh, Web development Lahore, AI agents, Hospital management system, POS software, ZATCA e-invoicing">
    <meta name="author" content="Loops Technologies">
    
    <!-- Social Sharing -->
    <meta property="og:title" content="Loops Technologies | High-Impact Software Solutions">
    <meta property="og:description" content="Expert Web, Mobile, and AI solutions with local support in Riyadh and Lahore.">
    <meta property="og:image" content="img/loopstech-logo.png">
    <meta property="og:url" content="https://loopstech.com">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        arabic: ['Noto Sans Arabic', 'sans-serif']
                    },
                    colors: { 
                        primary: '#4f46e5', // Indigo-600
                        secondary: '#10b981', // Emerald-500
                        dark: '#0f172a', // Slate-900
                        light: '#f8fafc' // Slate-50
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'reveal': 'reveal 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        reveal: {
                            'from': { opacity: '0', transform: 'scale(0.95)' },
                            'to': { opacity: '1', transform: 'scale(1)' },
                        },
                        slideUp: {
                            'from': { opacity: '0', transform: 'translateY(30px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: '0' },
                            'to': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .bg-soft-gradient { background: radial-gradient(circle at top right, #eef2ff, #f8fafc); }
        .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        
        [dir="rtl"] .fa-arrow-right, [dir="rtl"] .fa-chevron-right { transform: rotate(180deg); }
        
        .reveal-on-scroll { opacity: 0; }
        .reveal-on-scroll.is-visible { animation: slideUp 0.8s ease-out forwards; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4338ca; }

        #app-transition-layer {
            position: fixed;
            inset: 0;
            background: #4f46e5;
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #app-transition-layer.active { transform: translateX(0); }
        #app-transition-layer.finished { transform: translateX(-100%); }
    </style>
</head>
<body class="bg-light text-dark leading-relaxed overflow-x-hidden">

    <div id="app-transition-layer"></div>

    <!-- Navigation -->
    <header class="fixed top-0 w-full z-50 glass border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <img src="img/loopstech-logo.png" alt="Loops Technologies" class="h-10 md:h-12 w-auto group-hover:scale-105 transition-transform">
            </a>

            <nav class="hidden lg:flex gap-10" id="nav-links">
                <!-- Links injected by JS -->
            </nav>

            <div class="flex items-center gap-4">
                <!-- Language Switcher -->
                <div class="flex items-center bg-slate-100 rounded-full p-1 gap-1">
                    <button onclick="App.setLanguage('en')" id="lang-en" class="text-[10px] font-bold px-3 py-1.5 rounded-full transition-all">EN</button>
                    <button onclick="App.setLanguage('ar')" id="lang-ar" class="text-[10px] font-bold px-3 py-1.5 rounded-full transition-all">AR</button>
                    <button onclick="App.setLanguage('ro')" id="lang-ro" class="text-[10px] font-bold px-3 py-1.5 rounded-full transition-all">RO</button>
                </div>

                <a href="https://wa.me/966597441504" target="_blank" class="hidden md:flex bg-secondary text-white px-6 py-2.5 rounded-full text-xs font-bold items-center gap-2 hover:bg-emerald-600 shadow-lg shadow-emerald-200 transition-all active:scale-95">
                    <i class="fab fa-whatsapp text-lg"></i> <span id="live-chat-text">Live Chat</span>
                </a>
                <button id="mobile-menu-btn" class="lg:hidden p-2 text-2xl text-primary"><i class="fa fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="fixed inset-0 bg-white z-[60] p-8 hidden flex-col gap-8 text-center justify-center animate-fade-in">
        <button id="close-menu" class="absolute top-6 right-6 text-3xl text-primary"><i class="fa fa-times"></i></button>
        <div class="flex flex-col gap-8" id="mobile-nav-links">
            <!-- Links injected by JS -->
        </div>
    </div>

    <!-- App Container -->
    <main id="app" class="mt-20">
        <!-- Content injected by JS -->
        <div class="flex items-center justify-center min-h-[80vh]">
            <div class="flex flex-col items-center gap-4">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-primary"></div>
                <p class="font-bold text-primary animate-pulse uppercase tracking-widest text-xs">Initializing Excellence...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-slate-400 pt-24 pb-12">
        <!-- Footer injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
